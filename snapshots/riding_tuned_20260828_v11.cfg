# riding.cfg - per-species seat tuning
# <species>=<mode>,<up>,<forward>,<mount>,<sit>,<roll>,<pitch>,<yaw>,<posture>,<lateral>  mode 0=exact 1=midpoint 2=neck 3=rear  sit 0=off 1=on  posture 0=sit 1=stand  lateral=side offset
# columns 4 and 6-8 are OBSOLETE legacy fields (mount method / roll-pitch-yaw) - parsed-and-ignored, always written as 0
# columns 11-14 = persisted seat constants (anchor x/y/z + bob baseline), auto-captured - do not hand-edit
# columns 15-17 = the declared zero/home (up, forward, lateral): Numpad9 returns here, Ctrl+Numpad9 sets it to the current seat
# column 18 = the animal size columns 2/3/10/14 were tuned at; the seat is rescaled for bigger/smaller individuals of the same species (0 = unknown, no rescaling)
# this file only OVERRIDES the seats built into RidingPlugin.dll - delete it to go back to the shipped defaults
#
# v9 (2026-08-28) = ONE row per animal race, keyed by the race stringID instead of by the
# localized animal name.  v8's 42 name rows were 42 hand-tuned seats for 21 races: every
# extra row existed only because a seat could not follow body size, so each scaled-up member
# needed its own numbers.  Column 18 (v7) removed that need - the seat is now rescaled from
# the size it was confirmed at - so the duplicates are gone and each race is standardized on
# one member's numbers.  Nothing was retyped: every row below is a byte copy of the value
# half of one v8 name row (listed under "canonical member" below).
#
# A row may still be keyed by a localized animal NAME, and such a row wins over its race row.
# That is how you give one animal its own seat without touching its relatives: ride it, tune
# it with the seat keys, and the plugin writes a name row for it.
#
# canonical member per race, in the row order below:
#   2860-gamedata.base             Beak Thing           <- 喙嘴兽  (only tuned member)
#   3966-gamedata.base             Leviathan            <- 利维坦  (only tuned member)
#   3976-gamedata.base             Bonedog              <- 山犬  (5 members, identical numbers)
#   3985-gamedata.base             Bull                 <- 野牛  (USER: keep 野牛 over 驮牛)
#   3987-gamedata.base             Swamp Turtle         <- 沼泽乌龟  (only tuned member)
#   3992-gamedata.base             Goat                 <- 山羊  (3 members, identical numbers)
#   3998-gamedata.base             Garru                <- 驮兽  (3 members, identical numbers)
#   42068-small_changes_otto.mod   Cage Beast           <- 笼中野兽  (only tuned member)
#   42070-small_changes_otto.mod   Robot Spider Worker  <- 铁蜘蛛  (USER: keep 铁蜘蛛 (= 铁之蜘蛛, byte-identical))
#   42071-small_changes_otto.mod   Swamp Raptor         <- 沼泽沼泽速龙  (smaller member = the law's validated basis)
#   43870-rebirth.mod              Spider               <- 人皮蜘蛛  (only tuned member)
#   43947-rebirth.mod              Bull (domesticated)  <- 家牛  (only tuned member)
#   44910-rebirth.mod              River Raptor         <- 河之沼泽速龙  (only tuned member)
#   48689-rebirth.mod              Robot Guard Spider   <- 安全蜘蛛  (USER: one row per race)
#   50641-rebirth.mod              Small Spider         <- 血之蜘蛛  (only tuned member)
#   56088-rebirth.mod              Skimmer              <- 剪嘴鸥  (only tuned member)
#   56089-Newwworld.mod            Crab                 <- 螃蟹  (USER: keep the small-crab mode-2 seat)
#   56112-Newwworld.mod            Big-Bones            <- 清洁组件  (only tuned member)
#   65260-Newwworld.mod            Crimper              <- 卷缩者  (USER: keep 卷缩者 over 国王)
#   66294-Newwworld.mod            Boneyard Wolf        <- 埋骨地狼  (only tuned member)
#   97570-Newwworld.mod            Land Bat             <- 陆地蝙蝠  (only tuned member)
#
# v10 (2026-08-28) = v9's 21 rows with exactly ONE number changed: the crab race
# (56089-Newwworld.mod) up 0.00 -> 0.27, tuned in game on 巨型蟹蟹 (k=1.846) and then
# confirmed by the player on both scale brackets at once - the four big crabs (1.5-2.25)
# AND the small ones (.10-1.00) all seat correctly off this single mode-2 neck seat.
# That falsifies v9's own header note above, which predicted the big crabs would need
# their own name rows because their old hand tune used a different anchor mode.
#
# v11 (2026-08-28) = v10's 21 rows with exactly ONE number changed back: the crab race
# (56089-Newwworld.mod) up 0.27 -> 0.00, i.e. this row is byte-identical to v9 again.
# v10's 0.27 was the player's own in-game tune and it tested fine on all six crab sizes,
# but after Numpad9 reset one crab to the 0.00 home the player compared the two and chose
# 0.00 as the shipped seat.  Pure taste call at 0.27u in the reference frame - the affine
# size law and everything else about the row is untouched.
