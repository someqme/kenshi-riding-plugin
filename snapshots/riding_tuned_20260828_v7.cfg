# riding.cfg - per-species seat tuning
# <species>=<mode>,<up>,<forward>,<mount>,<sit>,<roll>,<pitch>,<yaw>,<posture>,<lateral>  mode 0=exact 1=midpoint 2=neck 3=rear  sit 0=off 1=on  posture 0=sit 1=stand  lateral=side offset
# columns 4 and 6-8 are OBSOLETE legacy fields (mount method / roll-pitch-yaw) - parsed-and-ignored, always written as 0
# columns 11-14 = persisted seat constants (anchor x/y/z + bob baseline), auto-captured - do not hand-edit
# columns 15-17 = the declared zero/home (up, forward, lateral): Numpad9 returns here, Ctrl+Numpad9 sets it to the current seat
# column 18 = the animal size columns 2/3/10/14 were tuned at; the seat is rescaled for bigger/smaller individuals of the same species (0 = unknown, no rescaling)
# this file only OVERRIDES the seats built into RidingPlugin.dll - delete it to go back to the shipped defaults
#
# v7 (2026-08-28) = v6's 42 rows, not one byte changed, plus column 18: the body size each
# row's numbers were CONFIRMED correct at.  That column is what makes one hand-tuned
# individual cover every size in its species, because the height a rider needs is affine in
# body size, not proportional to it:
#     up(scale) = A * scale + B,   B = -6.4 = the rider's OWN sit height (it does not scale,
#                                  the rider is always the same human)
# so adapting from one confirmed sample is up(live) = (up_ref - B) * live/ref + B, while
# forward / lateral / the column-14 bob baseline scale proportionally (horizontally the
# rider is a point, and the baseline is measured with the height tune already stripped off).
# Regression against the 12 same-race pairs that had already been tuned separately by hand:
# within 0.07-0.34u, against up to 7.97u for naive proportional scaling.  The decisive case
# is 沼泽沼泽速龙 1.482 -> 巨型沼泽速龙 3.350, a 2.26x span where the law predicts 7.61
# against the hand-tuned 7.52 (proportional gives -0.45).
#
# Every non-zero value in column 18 is an nsc= reading logged on a mount the player then
# reported as correctly seated - none of them is a guess.  The five rows that are byte
# copies of another row carry the SOURCE row's size, because that is where their numbers
# were confirmed: 螃蟹<-提多, 螃蟹终结者<-巨型螃蟹, 宠物犬<-山犬, 国王<-卷缩者, 牛<-野牛.
# Four rows keep 0 = never measured = never adapted, behaving exactly as they do today:
# Megaraptor (offsets are 0/0 regardless), Pack Bull, 铁蜘蛛, 铁之蜘蛛.
#
# The v5 clone rule still applies to which rows EXIST: same race AND same scale bracket.
# Column 18 is what makes the bracket half of that rule stop mattering - a scaled member no
# longer needs its own hand-tuned row, only its own size reading.
#   race 3998-gamedata.base  scale .35-1.00 = Pack Beast / Pack Beast Dead / Garru
#   race 3992-gamedata.base  scale .35-1.00 = Goat / Cornelius / Beloved Goat
#   race 3976-gamedata.base  scale .30-1.10 = Mountain Dog / Bonedog / Horse Dog / Settler's Pup
#   race 56089-Newwworld.mod scale 1.5-2.25 = Megacrab / The Crabinator / Mr Gigantus / Barnabus
#   race 56089-Newwworld.mod scale .10-1.00 = Crab / Titus
# NOTE: getRadius() is a RACE-level constant (= the race record's "hull size Y": crab hull
# Y=22 -> rad 22.0 for every crab whatever its scale), so it CANNOT tell scaled members
# apart.  The live scene-node scale (nsc=) can, and that is what column 18 is measured in.
